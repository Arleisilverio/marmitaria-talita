<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141712" />
      <stop offset="50%" stop-color="#0d0f0c" />
      <stop offset="100%" stop-color="#070806" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b54" />
      <stop offset="60%" stop-color="#e2725b" />
      <stop offset="100%" stop-color="#d65a40" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="100%" stop-color="#ffa133" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e2725b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="16 12" stroke-opacity="0.2" />

  <!-- Main Emblem Shape -->
  <g filter="url(#glow)">
    <!-- Base geometric badge -->
    <rect x="100" y="100" width="312" height="312" rx="64" fill="#181c15" stroke="url(#primaryGrad)" stroke-width="4" />

    <!-- DQ Stylized Monogram -->
    <!-- D Letter -->
    <path d="M150 160 H210 C250 160 275 185 275 225 C275 265 250 290 210 290 H150 Z" fill="url(#primaryGrad)" />
    <path d="M185 195 H205 C225 195 238 207 238 225 C238 243 225 255 205 255 H185 Z" fill="#181c15" />

    <!-- Q Letter -->
    <path d="M295 255 C295 210 325 180 370 180 C415 180 445 210 445 255 C445 300 415 330 370 330 C352 330 335 324 322 312 L300 334 L280 314 L303 291 C298 280 295 268 295 255 Z M370 295 C392 295 408 277 408 255 C408 233 392 215 370 215 C348 215 332 233 332 255 C332 277 348 295 370 295 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Modern delivery / food dot tag -->
  <circle cx="390" cy="140" r="14" fill="#ff7b54" filter="url(#glow)" />
  <circle cx="390" cy="140" r="7" fill="#ffffff" />

  <!-- Subtitle Tag -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4" text-anchor="middle">DA QUEBRADA</text>
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2725b" letter-spacing="6" text-anchor="middle">DELIVERY &amp; COMÉRCIO</text>
</svg>
